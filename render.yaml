services:
  - type: web
    name: intake-copilot-backend
    runtime: node
    rootDir: backend
    buildCommand: corepack enable pnpm && pnpm --dir backend install
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: intake-copilot-client
    runtime: static
    rootDir: client
    buildCommand: corepack enable pnpm && pnpm --dir client install && pnpm --dir client build
    staticPublishPath: dist
    envVars:
      - key: VITE_RUNTIME_URL
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false
