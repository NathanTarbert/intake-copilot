services:
  - type: web
    name: intake-copilot
    runtime: node
    rootDir: backend
    buildCommand: "cd .. && npx --yes pnpm@11 --dir client install --ignore-scripts && npx pnpm@11 --dir client build && npx pnpm@11 --dir backend install --ignore-scripts"
    startCommand: npx pnpm@11 start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false
